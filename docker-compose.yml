version: '3.8'

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: tapin
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped

  coturn:
    image: instrumentisto/coturn
    restart: unless-stopped
    ports:
      - 3478:3478
    environment:
      - TURN_STATIC_AUTH_SECRET=turnsecret
    command: ["--server-name=turn", "--external-ip=127.0.0.1"]

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    ports:
      - 7880:7880 # HTTP API
      - 7881:7881 # WebRTC websocket (if exposed)
      - 7883:7883 # UDP relay for WebRTC (example)
    environment:
      - LIVEKIT_KEYS=example_key:example_secret
      - LIVEKIT_HTTPS_PORT=7880
      - LIVEKIT_RTC_PORT=7883
      - LIVEKIT_UDP_PORT=7883
    depends_on:
      - coturn

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - 8000:8000
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/tapin
      - REDIS_URL=redis://redis:6379/0
      - LIVEKIT_API_KEY=example_key
      - LIVEKIT_API_SECRET=example_secret
    depends_on:
      - postgres
      - redis
      - livekit

volumes:
  postgres-data:
