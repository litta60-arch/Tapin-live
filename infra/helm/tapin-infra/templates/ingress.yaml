{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tapin-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt"
spec:
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: tapin-backend
                port:
                  number: {{ .Values.backend.port }}
          - path: /livekit
            pathType: Prefix
            backend:
              service:
                name: tapin-livekit
                port:
                  number: {{ .Values.livekit.httpPort }}
{{- end }}
