apiVersion: v1
kind: Secret
metadata:
  name: tapin-secrets
type: Opaque
stringData: {}
# The actual secret values are templated below to encourage use of Helm secrets or external secret managers.
---
apiVersion: v1
kind: Secret
metadata:
  name: tapin-credentials
type: Opaque
data:
  livekit_api_key: {{ .Values.backend.env.LIVEKIT_API_KEY | b64enc }}
  livekit_api_secret: {{ .Values.backend.env.LIVEKIT_API_SECRET | b64enc }}
  postgres_password: {{ .Values.postgres.postgresPassword | b64enc }}
  redis_url: {{ .Values.backend.env.REDIS_URL | b64enc }}
  coturn_static_secret: {{ .Values.coturn.staticAuthSecret | b64enc }}
